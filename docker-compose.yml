services:

  # =====================================
  # PostgreSQL
  # =====================================
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - taskflow-network


  # =====================================
  # Redis
  # =====================================
  redis:
    image: redis:7-alpine
    container_name: taskflow-redis

    ports:
      - "6379:6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - taskflow-network


  # =====================================
  # Backend
  # =====================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: taskflow-backend

    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT}

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - taskflow-network


  # =====================================
  # Frontend
  # =====================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: taskflow-frontend

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - taskflow-network


# =====================================
# PostgreSQL Persistent Volume
# =====================================
volumes:
  postgres_data:


# =====================================
# Application Network
# =====================================
networks:
  taskflow-network:
    driver: bridge